# Weekly free puzzle (Cluedoku, owner 2026-11-23). Copy of docs/website/weekpuzzel/weekpuzzel.yml in the Cluedoku repo.
# Every Monday at 05:00 UTC: run publiceer.mjs from the `wachtrij` branch on this site and push the result.
name: Weekpuzzel
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: weekpuzzel
jobs:
  publiceer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: site
      - uses: actions/checkout@v5
        with:
          ref: wachtrij
          path: wachtrij
      - name: Publish this week's puzzle
        run: node wachtrij/publiceer.mjs site
      - name: Commit and push
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -q -m "Weekly puzzle $(date -u +%F)"
          git push -q
          # a push with the workflow token may not start a Pages build by itself
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
