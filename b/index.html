<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cluedoku</title>
<link rel="icon" href="/favicon.png">
<style>
:root { color-scheme: light; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2b2140; color: #2b2140; font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
.kaart { background: #fff8f1; border-radius: 20px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 6px 0 #1a1428; }
h1 { font-size: 1.4rem; margin: 0 0 10px; }
p { margin: 0 0 20px; line-height: 1.45; }
a.knop { display: inline-block; background: #ff6b6b; color: #fff; text-decoration: none; font-weight: 700; padding: 14px 26px; border-radius: 14px; box-shadow: 0 4px 0 #e04e4e; }
</style>
</head>
<body>
<main class="kaart">
<h1 id="kop">Cluedoku</h1>
<p id="tekst"></p>
<a class="knop" id="knop" href="https://play.google.com/store/apps/details?id=com.vdhd.cluedoku">Cluedoku</a>
</main>
<script>
(function () {
  var T = {"nl":["Je vriend speelt nu ook Cluedoku!","Tik op de knop om de app te openen: daar krijg je je zaken.","Open Cluedoku","Deze link is niet compleet."],"en":["Your friend is playing Cluedoku now!","Tap the button to open the app: your cases are waiting there.","Open Cluedoku","This link is not complete."],"de":["Dein Freund spielt jetzt auch Cluedoku!","Tippe auf den Knopf, um die App zu öffnen: Dort bekommst du deine Fälle.","Cluedoku öffnen","Dieser Link ist nicht vollständig."],"fr":["Votre ami joue maintenant à Cluedoku !","Touchez le bouton pour ouvrir l'application : vos affaires vous y attendent.","Ouvrir Cluedoku","Ce lien n'est pas complet."],"it":["Il tuo amico ora gioca a Cluedoku!","Tocca il pulsante per aprire l'app: lì ricevi i tuoi casi.","Apri Cluedoku","Questo link non è completo."],"es":["¡Tu amigo ya juega a Cluedoku!","Toca el botón para abrir la app: allí recibes tus casos.","Abrir Cluedoku","Este enlace no está completo."],"pt":["O teu amigo já joga Cluedoku!","Toca no botão para abrir a app: lá recebes os teus casos.","Abrir o Cluedoku","Este link não está completo."],"pt-BR":["Seu amigo agora joga Cluedoku!","Toque no botão para abrir o app: lá você ganha seus casos.","Abrir o Cluedoku","Este link não está completo."],"pl":["Twój znajomy gra już w Cluedoku!","Stuknij przycisk, aby otworzyć aplikację: tam dostaniesz swoje sprawy.","Otwórz Cluedoku","Ten link jest niepełny."]};
  var talen = (navigator.languages || [navigator.language || 'en']).map(function (l) { return String(l); });
  var t = T.en;
  for (var i = 0; i < talen.length; i++) {
    var l = talen[i];
    if (T[l]) { t = T[l]; break; }
    if (/^pt-BR/i.test(l)) { t = T['pt-BR']; break; }
    var k = l.split('-')[0].toLowerCase();
    if (T[k]) { t = T[k]; break; }
  }
  var token = (location.hash || '').replace(/^#/, '').toLowerCase();
  var play = 'https://play.google.com/store/apps/details?id=com.vdhd.cluedoku';
  document.getElementById('kop').textContent = t[0];
  var knop = document.getElementById('knop');
  knop.textContent = t[2];
  if (!/^[a-z0-9]{8}.[a-z0-9]{8}.[0-9a-f]{12}$/.test(token)) { document.getElementById('tekst').textContent = t[3]; return; }
  document.getElementById('tekst').textContent = t[1];
  knop.href = 'intent://bedankt/' + token + '#Intent;scheme=cluedoku;package=com.vdhd.cluedoku;S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
})();
</script>
</body>
</html>
